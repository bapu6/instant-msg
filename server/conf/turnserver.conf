# ===================================================
# Coturn STUN & TURN Server Configuration for Instant Msg
# ===================================================

# Standard listening ports
listening-port=3478
tls-listening-port=5349

# Authentication & Realm
realm=instantmsg
lt-cred-mech
user=instantmsg:secretturnpass123

# Relay port range (for media packets)
min-port=49152
max-port=49200

# Security & Protocols
fingerprint
no-cli

# Logging
verbose
log-file=stdout
