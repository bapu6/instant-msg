loglevel: info

hosts:
  - "localhost"

disable_sasl_mechanisms:
  - "SCRAM-SHA-1"
  - "digest-md5"

listen:
  - port: 5222
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    starttls: true
    starttls_required: false

  - port: 5280
    ip: "::"
    module: ejabberd_http
    request_handlers:
      "/ws": ejabberd_http_ws
      "/websocket": ejabberd_http_ws
      "/bosh": mod_bosh
      "/http-bind": mod_bosh
      "/admin": ejabberd_web_admin
      "/api": mod_http_api
    web_admin: true
    http_bind: true

auth_method: internal

acl:
  admin:
    user:
      - "admin@localhost"
  local:
    user_regexp: ""

access_rules:
  local:
    allow: local
  c2s:
    deny: blocked
    allow: all
  announce:
    allow: admin
  configure:
    allow: admin
  register:
    allow: all

shaper:
  normal:
    rate: 3000
    burst_size: 20000
  fast:
    rate: 100000
    burst_size: 500000

shaper_rules:
  max_user_sessions: 10
  max_user_offline_messages:
    5000: admin
    100: all
  c2s_shaper:
    none: admin
    normal: all

modules:
  mod_roster:
    versioning: true
  mod_privacy: {}
  mod_private: {}
  mod_disco: {}
  mod_last: {}
  mod_version: {}
  mod_time: {}
  mod_vcard: {}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_bosh: {}
  mod_stream_mgmt: {}
  mod_ping:
    send_pings: true
    ping_interval: 60
    timeout_action: kill
  mod_register:
    access_from: register
    access: register
    welcome_message:
      subject: "Welcome!"
      body: "Welcome to your local XMPP service!"
  mod_muc:
    access:
      - allow
    access_admin:
      - allow: admin
    access_create: local
    access_persistent: local
    default_room_options:
      persistent: true
      mam: false
  mod_http_api: {}
